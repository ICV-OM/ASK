*{box-sizing:border-box}

    en:"Turn this lesson into a one-page study sheet containing: subheadings, the 5 key definitions, 3 examples, and a “Warning: watch out for this” box. Stay under 250 words. Lesson: [ ]" },
  { t:{ar:"استخراج المصطلحات",en:"Extract the Terms"},
    ar:"استخرج من هذا النص كل المصطلحات العلمية أو الصعبة فقط، ورّتبها أبجديًا، واشرح كل واحد في ١٠ كلمات أو أقل. النص: [ ]",
    en:"Extract only the scientific or difficult terms from this text, sort them alphabetically, and explain each in 10 words or fewer. Text: [ ]" },
  { t:{ar:"التلخيص المقارن",en:"Comparative Summary"},
    ar:"قارن بين [المفهوم الأول] و[المفهوم الثاني] من هذا الدرس في جدول: أوجه الشبه، أوجه الاختلاف، وكيف أمّيز بينهما بسرعة في الامتحان. الدرس: [ ]",
    en:"Compare [concept 1] and [concept 2] from this lesson in a table: similarities, differences, and how to tell them apart quickly in an exam. Lesson: [ ]" },
  { t:{ar:"ملّخص صوتي للمراجعة",en:"Audio Revision Script"},
    ar:"حّول هذا الملخص إلى نص أستمع إليه أثناء المشي، مدته دقيقتان تقريبًا. اجعل الأسلوب حواريًا كأنك تتحدث إلّي مباشرة، وكّرر أهم ٣ معلومات في النهاية. الملخص: [ ]",
    en:"Turn this summary into a script I can listen to while walking, about two minutes long. Make it conversational, as if speaking to me directly, and repeat the 3 key facts at the end. Summary: [ ]" },
  { t:{ar:"تحويل الدرس إلى قصة",en:"Lesson as a Story"},
    ar:"حّول معلومات هذا الدرس إلى قصة قصيرة مسلية لا تتجاوز ٢٠٠ كلمة، بحيث تكون كل معلومة مهمة جزءًا من أحداث القصة. ثم اكتب تحتها قائمة بالمعلومات التي وردت فيها. الدرس: [ ]",
    en:"Turn this lesson’s content into a fun short story under 200 words, where each key fact is part of the plot. Then list underneath which facts appeared in it. Lesson: [ ]" },
  { t:{ar:"تلخيص نص طويل",en:"Summarize a Long Text"},
    ar:"هذا نص طويل: [ ]. أعطني ثلاثة مستويات من التلخيص: (١) جملة واحدة، (٢) فقرة من ٥ أسطر، (٣) ملخص مفّصل بالعناوين. واذكر في النهاية ما الذي حذفته ولم أخسر بحذفه.",
    en:"Here is a long text: [ ]. Give me three levels of summary: (1) one sentence, (2) a 5-line paragraph, (3) a detailed summary with headings. At the end, state what you cut that I don’t lose by cutting." }
]},
{ id:"sec-3", num:"٣", color:"#7C5CD6", tint:"#F1ECFC", icon:"explain",
  title:{ ar:"شرح الدروس", en:"Explaining Lessons" },
  prompts:[
  { t:{ar:"اشرح كأني في العاشرة",en:"Explain Like I’m Ten"},
    ar:"اشرح لي [الموضوع] كأني طفل في العاشرة لم يسمع به من قبل. استخدم ُجملًا قصيرة، وتشبيهًا واحدًا من حياتي اليومية، ولا تستخدم أي مصطلح دون أن تشرحه فورًا.",
    en:"Explain [topic] to me as if I’m a 10-year-old who has never heard of it. Use short sentences, one analogy from everyday life, and never use a term without immediately explaining it." },
  { t:{ar:"الشرح بثلاثة مستويات",en:"Three-Level Explanation"},
    ar:"اشرح لي [الموضوع] بثلاثة مستويات متتالية: أولًا في جملة واحدة، ثم في فقرة بسيطة، ثم بشرح تفصيلي مع مثال. توّقف بعد كل مستوى واسألني إن كنت مستعدًا للمستوى التالي.",
    en:"Explain [topic] at three successive levels: first in one sentence, then in a simple paragraph, then in detail with an example. Pause after each level and ask if I’m ready for the next." },
  { t:{ar:"تشبيهات من الحياة اليومية",en:"Everyday Analogies"},
    ar:"أعطني ٣ تشبيهات مختلفة تشرح [المفهوم]، مأخوذة من أشياء يعرفها طالب في الصف [ ] مثل الرياضة أو المطبخ أو الألعاب. ثم اشرح أين ينتهي كل تشبيه ولا يعود دقيقًا.",
    en:"Give me 3 different analogies for [concept], drawn from things a grade [ ] student knows like sports, cooking, or games. Then explain where each analogy breaks down and stops being accurate." },
  { t:{ar:"المساعدة دون كشف الحل",en:"Help Without the Answer"},
    ar:"لا تعطني الحل النهائي. عّلمني كيف أحّل هذه المسألة خطوة بخطوة: اذكر الخطوة الأولى فقط، ثم اسألني ماذا أفعل بعدها وانتظر إجابتي. المسألة: [ ]",
    en:"Don’t give me the final answer. Teach me how to solve this problem step by step: state only the first step, then ask me what comes next and wait for my answer. Problem: [ ]" },
  { t:{ar:"سلسلة “لماذا؟”",en:"The “Why?” Chain"},
    ar:"اشرح لي [الظاهرة أو القاعدة]، ثم أجب عن سؤال “لماذا؟” خمس مرات متتالية، بحيث يغوص كل جواب أعمق من الذي قبله حتى نصل إلى السبب الجذري.",
    en:"Explain [phenomenon or rule] to me, then answer “why?” five times in a row, each answer digging deeper than the last until we reach the root cause." },
  { t:{ar:"الفرق بين المتشابهات",en:"Telling Similar Things Apart"},
    ar:"أنا دائمًا أخلط بين [ ] و[ ]. اشرح لي الفرق بينهما بجدول قصير، ثم أعطني حيلة سهلة لتذّكر الفرق، ثم اختبرني بـ٤ أمثلة أصّنفها بنفسي.",
    en:"I always confuse [ ] and [ ]. Explain the difference in a short table, give me an easy trick to remember it, then test me with 4 examples for me to classify myself." },
  { t:{ar:"اشرح ثم اختبرني",en:"Explain, Then Test Me"},
    ar:"اشرح لي [الموضوع] في فقرة واحدة واضحة، ثم اطرح علّي ٣ أسئلة تتأكد بها أني فهمت فعلًا لا حفظت فقط. انتظر إجاباتي قبل أن تكمل.",
    en:"Explain [topic] in one clear paragraph, then ask me 3 questions that check whether I truly understood rather than memorized. Wait for my answers before continuing." },
  { t:{ar:"الشرح بالمخطط",en:"Explain with a Diagram"},
    ar:"ارسم لي بالنص (باستخدام الأسهم والمربعات) كيف تحدث [العملية] من بدايتها إلى نهايتها، ثم اشرح كل مرحلة في سطر واحد تحت المخطط.",
    en:"Draw me a text diagram (using arrows and boxes) of how [process] happens from start to finish, then explain each stage in one line below the diagram." },
  { t:{ar:"ما فائدة هذا الدرس؟",en:"Why Does This Matter?"},
    ar:"لماذا أدرس [الموضوع]؟ أعطني ٣ أمثلة حقيقية على استخدامه في الحياة أو في وظائف المستقبل، ومثالًا واحدًا على ما قد يحدث لو لم يعرفه أحد.",
    en:"Why do I study [topic]? Give me 3 real examples of its use in life or future careers, plus one example of what could go wrong if nobody knew it." },
  { t:{ar:"لم أفهم هذه الجملة",en:"I Don’t Get This Sentence"},
    ar:"لم أفهم هذه الجملة من كتابي: “[الصق الجملة]”. فّككها لي كلمة كلمة، واشرح المقصود بأسلوب أبسط، ثم أعد كتابتها بلغتي أنا.",
    en:"I don’t understand this sentence from my textbook: “[paste sentence]”. Break it down word by word, explain the meaning more simply, then rewrite it in plain language for me." }
]},
{ id:"sec-4", num:"٤", color:"#C2438F", tint:"#FBEAF4", icon:"report",
  title:{ ar:"كتابة التقارير", en:"Writing Reports" },
  prompts:[
  { t:{ar:"خطة التقرير",en:"Report Outline"},
    ar:"أكتب تقريرًا عن [الموضوع] لمادة [ ]، وطوله المطلوب [عدد] كلمة. اقترح لي خطة (عناصر رئيسية وفرعية) مع عدد الكلمات المناسب لكل عنصر. لا تكتب المحتوى، الخطة فقط.",
    en:"I’m writing a report on [topic] for [subject], required length [number] words. Suggest an outline (main and sub-headings) with a suitable word count for each section. Don’t write the content — outline only." },
  { t:{ar:"صياغة سؤال البحث",en:"Framing the Research Question"},
    ar:"أريد أن أكتب عن [الموضوع العام]، لكنه واسع جدًا. اقترح لي ٥ أسئلة بحث محّددة ومناسبة لطالب في الصف [ ]، ورّتبها من الأسهل للأصعب في جمع المعلومات.",
    en:"I want to write about [broad topic], but it’s too wide. Suggest 5 specific research questions suitable for a grade [ ] student, ranked from easiest to hardest to research." },
  { t:{ar:"المقدمة القوية",en:"A Strong Introduction"},
    ar:"اكتب لي ٣ مقدمات مختلفة لتقرير عن [الموضوع]، كل واحدة بأسلوب مختلف: واحدة تبدأ بسؤال، وواحدة بمعلومة مدهشة، وواحدة بقصة قصيرة. لا تتجاوز كل مقدمة ٦ أسطر.",
    en:"Write me 3 different introductions for a report on [topic], each in a different style: one starting with a question, one with a surprising fact, and one with a short story. Keep each under 6 lines." },
  { t:{ar:"من نقاط إلى فقرات",en:"From Notes to Paragraphs"},
    ar:"هذه نقاطي المتفرقة عن [الموضوع]: [ ]. رّتبها منطقيًا واقترح كيف أربطها في فقرات — أعطني الجملة الأولى من كل فقرة فقط، وسأكمل أنا الباقي بنفسي.",
    en:"Here are my scattered notes on [topic]: [ ]. Organize them logically and suggest how to link them into paragraphs — give me only the opening sentence of each paragraph, and I’ll write the rest myself." },
  { t:{ar:"تحسين دون تغيير الأفكار",en:"Polish Without Changing Ideas"},
    ar:"هذه فقرة كتبتها بنفسي: [ ]. حّسن أسلوبها اللغوي فقط دون إضافة أي فكرة جديدة أو حذف فكرة موجودة، ثم اشرح لي في ٣ نقاط ما الذي غّيرته ولماذا.",
    en:"Here’s a paragraph I wrote myself: [ ]. Improve only the wording without adding or removing any idea, then explain in 3 points what you changed and why." },
  { t:{ar:"المصادر والاقتباس",en:"Sources & Citation"},
    ar:"اشرح لي كيف أوّثق مصادري في تقرير مدرسي عن [الموضوع]، وأعطني قالبًا جاهزًا لتوثيق: كتاب، وموقع إلكتروني، ومقطع فيديو. ثم ذّكرني بالفرق بين الاقتباس والسرقة العلمية.",
    en:"Explain how to cite my sources in a school report on [topic], and give me a ready template for citing: a book, a website, and a video. Then remind me of the difference between quoting and plagiarism." },
  { t:{ar:"الخاتمة والتوصيات",en:"Conclusion & Recommendations"},
    ar:"هذه خلاصة تقريري عن [الموضوع]: [ ]. اكتب لي خاتمة من ٥ أسطر لا تكّرر ما قلته، بل تجيب عن سؤال “وماذا بعد؟”، وأضف تحتها ٣ توصيات عملية.",
    en:"Here’s the gist of my report on [topic]: [ ]. Write a 5-line conclusion that doesn’t repeat what I said but answers “so what now?”, and add 3 practical recommendations below it." },
  { t:{ar:"المراجعة النقدية",en:"Critical Review"},
    ar:"اقرأ تقريري ثم تصّرف كمعّلم يصّححه. أعطني: ٣ نقاط قوة، و٣ نقاط ضعف، و٣ اقتراحات محّددة للتحسين. لا تِعد كتابة التقرير. التقرير: [ ]",
    en:"Read my report and act as a teacher grading it. Give me: 3 strengths, 3 weaknesses, and 3 specific improvement suggestions. Do not rewrite the report. Report: [ ]" },
  { t:{ar:"التدقيق قبل التسليم",en:"Pre-Submission Checklist"},
    ar:"أعطني قائمة تدقيق من ١٢ بندًا أراجع بها تقريري قبل تسليمه لمعلمي، تشمل: المحتوى، والترتيب، واللغة، والمصادر، والشكل. اجعلها في صيغة مربعات أضع فيها علامة.",
    en:"Give me a 12-item checklist to review my report before submitting it, covering: content, structure, language, sources, and formatting. Present it as checkboxes I can tick." },
  { t:{ar:"ضبط الطول",en:"Hitting the Word Count"},
    ar:"تقريري طوله [ ] كلمة والمطلوب [ ] كلمة. حّدد لي أي الفقرات يمكن اختصارها أو حذفها ولماذا، دون أن نفقد أي فكرة أساسية. لا تختصرها أنت — أخبرني فقط أين أقّص. التقرير: [ ]",
    en:"My report is [ ] words but the requirement is [ ] words. Tell me which paragraphs can be shortened or cut and why, without losing any core idea. Don’t shorten it yourself — just tell me where to cut. Report: [ ]" }
]},
{ id:"sec-5", num:"٥", color:"#E4572E", tint:"#FCEBE4", icon:"persona",
  title:{ ar:"نمط الشخصية (معّلم وطالب)", en:"Persona Mode (Teacher & Student)" },
  note:{ ar:"لماذا ينفع نمط الشخصية؟ لأن عقلك يتذّكر الحوار أكثر من الفقرة الجامدة. عندما تتحدث مع “معّلم” أو تشرح لـ“طالب” تتحّول المعلومة إلى موقف تعيشه فتثبت.",
         en:"Why does persona mode work? Your brain remembers a conversation better than a static paragraph. Talking to a “teacher” — or explaining to a “student” — turns information into a situation you live through, so it sticks." },
  prompts:[
  { t:{ar:"المعّلم الصبور",en:"The Patient Teacher"}, group:{ar:"أولًا: شخصية المعّلم",en:"First: the teacher persona"},
    ar:"تقّمص شخصية معّلم [المادة] صبور يشرح لطالب في الصف [ ]. اشرح لي [الموضوع] بأسلوبك الهادئ، وتوّقف بعد كل فكرة لتسألني: “هل وصلت الفكرة؟”. لا تنتقل للفكرة التالية قبل أن أجيب.",
    en:"Take on the persona of a patient [subject] teacher explaining to a grade [ ] student. Explain [topic] in your calm style, and pause after each idea to ask me: “Did that make sense?”. Don’t move on until I answer." },
  { t:{ar:"المعّلم الذي يسأل ولا يجيب",en:"The Teacher Who Only Asks"},
    ar:"تقّمص شخصية معّلم لا يعطي الإجابات أبدًا، بل يوصل طلابه إليها بالأسئلة. موضوعنا: [ ]. اطرح علّي سؤالًا واحدًا في كل مرة، وإن أخطأت لا تصّححني مباشرة بل اسألني سؤالًا أسهل يقودني للصواب بنفسي.",
    en:"Take on the persona of a teacher who never gives answers but guides students to them with questions. Our topic is [ ]. Ask me one question at a time, and if I’m wrong don’t correct me directly — ask an easier question that leads me to the answer myself." },
  { t:{ar:"المعّلم المصحِّح",en:"The Marking Teacher"},
    ar:"تقّمص شخصية معّلم [المادة] يصّحح ورقتي بعدل وصراحة. هذا عملي: [ ]. أعطني: الدرجة من ١٠ وسببها، و٣ نقاط قوة، و٣ أخطاء محّددة، ونصيحة واحدة للمرة القادمة. لا تِعد كتابة عملي.",
    en:"Take on the persona of a [subject] teacher marking my paper fairly and honestly. Here is my work: [ ]. Give me: a mark out of 10 with the reason, 3 strengths, 3 specific mistakes, and one tip for next time. Do not rewrite my work." },
  { t:{ar:"الطالب الذي لا يفهم",en:"The Student Who Doesn’t Get It"}, group:{ar:"ثانيًا: شخصية الطالب",en:"Second: the student persona"},
    ar:"تقّمص شخصية طالب في الصف [ ] لم يفهم درس [الموضوع] إطلاقًا، وأنا سأشرحه لك. اسألني أسئلة بسيطة وساذجة كلما غمض عليك شيء، ولا تتظاهر بالفهم أبدًا. وفي النهاية قّيم شرحي: ما الذي أوضحته جيدًا، وما الذي ما زال غامضًا عندك.",
    en:"Take on the persona of a grade [ ] student who doesn’t understand the lesson on [topic] at all — I’ll explain it to you. Ask me simple, naive questions whenever something is unclear, and never pretend to understand. At the end, evaluate my explanation: what I explained well, and what’s still unclear to you.",
    hint:{ar:"هذا أقوى أمر في المكتبة كلها — جّربه مرة واحدة وسترى الفرق.",en:"This is the strongest prompt in the whole library — try it once and you’ll see the difference."} },
  { t:{ar:"زميل المذاكرة",en:"The Study Partner"},
    ar:"تقّمص شخصية زميل يذاكر معي درس [الموضوع]. تبادل معي الأدوار: اشرح لي جزءًا، ثم اطلب مني أن أشرح لك الجزء التالي، وصّحح لي إن نقص شرحي. استمر بالتبادل حتى ننهي الدرس، ثم لّخص لي ما أتقنته وما يحتاج مراجعة.",
    en:"Take on the persona of a classmate studying the lesson on [topic] with me. Swap roles with me: explain one part to me, then ask me to explain the next part to you, and correct me if my explanation is incomplete. Keep alternating until we finish, then summarize what I’ve mastered and what needs revision." }
]},
{ id:"sec-6", num:"٦", color:"#E09B15", tint:"#FDF2DC", icon:"deck",
  title:{ ar:"العروض التقديمية", en:"Presentations" },
  prompts:[
  { t:{ar:"هيكل العرض الكامل",en:"Full Deck Structure"},
    ar:"ساعدني في تخطيط عرض تقديمي من [عدد] شرائح عن [الموضوع] لمادة [المادة]، مدته [عدد] دقائق. أعطني لكل شريحة: العنوان، و٣ نقاط مختصرة كحد أقصى، وفكرة صورة مقترحة. لا تكتب فقرات طويلة داخل الشرائح.",
    en:"Help me plan a [number]-slide presentation on [topic] for [subject], lasting [number] minutes. For each slide give me: a title, a maximum of 3 short bullet points, and a suggested image idea. Don’t write long paragraphs inside the slides." },
  { t:{ar:"الشريحة الأولى الجاذبة",en:"A Hooking Opener"},
    ar:"اقترح لي ٥ أفكار مختلفة لبداية عرض تقديمي عن [الموضوع] تجذب انتباه زملائي في أول ٣٠ ثانية: سؤال، رقم مدهش، قصة قصيرة، تجربة سريعة، أو صورة غامضة. اشرح لكل فكرة كيف أنّفذها.",
    en:"Suggest 5 different ways to open a presentation on [topic] that grab my classmates’ attention in the first 30 seconds: a question, a surprising number, a short story, a quick demo, or a mysterious image. Explain how to execute each." },
  { t:{ar:"تبسيط المعلومة المعّقدة",en:"Simplify Complex Info"},
    ar:"عندي معلومة معّقدة أريد وضعها في شريحة: [ ]. حّولها إلى شكل بصري يسهل فهمه (جدول، أو مخطط، أو مقارنة قبل/بعد)، واكتب لي النص المختصر الذي يظهر على الشريحة والنص الذي أقوله أنا شفهيًا.",
    en:"I have a complex piece of information for a slide: [ ]. Turn it into an easy-to-grasp visual format (a table, a diagram, or a before/after comparison), and write both the short text shown on the slide and what I say out loud." },
  { t:{ar:"نص الإلقاء لكل شريحة",en:"Speaker Notes per Slide"},
    ar:"هذه عناوين شرائحي: [ ]. اكتب لي ما أقوله شفهيًا عند كل شريحة في ٣ ُجمل فقط، بلغة طبيعية كأني أتحدث لا أقرأ. تجّنب الكلمات الصعبة التي قد أتعّثر في نطقها.",
    en:"Here are my slide titles: [ ]. Write what I should say out loud for each slide in just 3 sentences, in natural spoken language rather than written style. Avoid difficult words I might stumble over." },
  { t:{ar:"الانتقال بين الشرائح",en:"Slide Transitions"},
    ar:"أعطني جملة انتقال قصيرة أقولها بين كل شريحة والتي تليها في عرضي عن [الموضوع]، بحيث تربط الفكرتين وتجعل العرض متسلسلًا لا مقّطعًا. عناوين شرائحي: [ ]",
    en:"Give me a short transition sentence to say between each slide and the next in my presentation on [topic], linking the two ideas so the talk flows instead of feeling disjointed. My slide titles: [ ]" },
  { t:{ar:"ضبط الوقت",en:"Timing the Talk"},
    ar:"عرضي مدته [عدد] دقائق وعندي [عدد] شريحة. وّزع لي الوقت على الشرائح حسب أهميتها، وحّدد أي الشرائح يمكن اختصارها إن تأخر الوقت. عناويني: [ ]",
    en:"My presentation is [number] minutes with [number] slides. Distribute the time across slides according to importance, and mark which slides I can cut short if I run late. My titles: [ ]" },
  { t:{ar:"الأسئلة المتوّقعة",en:"Likely Questions"},
    ar:"بعد عرضي عن [الموضوع]، ما أكثر ٧ أسئلة قد يسألها معلمي أو زملائي؟ أعطني لكل سؤال إجابة مختصرة في سطرين، وأخبرني أي الأسئلة يحتاج مني بحثًا إضافيًا.",

    en:"I found this information about [topic]: [ ]. Teach me how to verify it myself: what are the 5 questions I should ask of any source? And what signs suggest a piece of information may be inaccurate?" },
  { t:{ar:"الفرق بين الرأي والحقيقة",en:"Fact vs. Opinion"},

    en:"Write 10 statements about [topic]: some facts, some opinions, and some exaggerated facts. I’ll classify them myself, then correct me and explain the linguistic clue that revealed each type." },
  { t:{ar:"وجهتا النظر",en:"Two Points of View"},
    ar:"موضوعي [ ] فيه رأيان مختلفان. اعرض لي أقوى ٣ حجج لكل طرف بإنصاف دون أن تنحاز، ثم اطرح علّي ٣ أسئلة تساعدني على تكوين رأيي الخاص المبني على دليل.",
    en:"My topic [ ] has two opposing views. Present the 3 strongest arguments for each side fairly without taking sides, then ask me 3 questions that help me form my own evidence-based opinion." },
  { t:{ar:"التغّلب على رهبة العرض",en:"Beating Stage Fright"},
    ar:"أشعر بالتوتر قبل العرض أمام صّفي. تصّرف كمدّرب. أعطني ٥ تقنيات عملية أطّبقها (قبل العرض بيوم، وقبله بدقائق، وأثناءه)، وماذا أفعل بالضبط إذا نسيت ما سأقوله في المنتصف.",
    en:"I get nervous before presenting to my class. Act as a coach. Give me 5 practical techniques to use (the day before, minutes before, and during), and exactly what to do if I forget my words halfway through." },

    en:"Here’s what I’ll say in my presentation: [ ]. Mark for me: where to pause, which words to stress, where to raise or lower my voice, and where to make eye contact. Put the cues in brackets within the text." },
  { t:{ar:"التقييم الذاتي بعد المشروع",en:"Self-Assessment After the Project"},
    ar:"أنهيت مشروعي عن [الموضوع]. اطرح علّي ٧ أسئلة تقييم ذاتي تساعدني على معرفة: ماذا تعّلمت فعلًا، وما الذي كنت سأفعله بشكل مختلف، وما المهارة التي تحّسنت عندي. سؤالًا واحدًا في كل مرة.",
    en:"I’ve finished my project on [topic]. Ask me 7 self-assessment questions to help me identify: what I actually learned, what I’d do differently, and which skill improved. One question at a time." },

{ id:"sec-11", num:"١١", color:"#D97706", tint:"#FDF0DC", icon:"full",
  title:{ ar:"أوامر شاملة (أمر واحد = نشاط كامل)", en:"All-in-One Prompts (one prompt = a whole activity)" },
  note:{ ar:"نوعان من الأوامر — متى تستخدم كلًا منهما؟ الأوامر التدريجية (الأقسام السابقة) تخّطط معك خطوة بخطوة وتتعّلم وتتحّكم في كل تفصيلة. الأوامر الشاملة (هذا القسم) تعطيك عملًا كاملًا جاهزًا في مرة واحدة — راجعه جيدًا قبل التسليم. سّر الأمر الشامل: المنهج + الصف + الألوان + الألعاب. وتنبيه: بعض الأدوات تعطيك نصًا فقط وتصّممه أنت — فإن جاء نصًا اطلب: “أخرجه لي في ملف قابل للطباعة”.",
         en:"Two kinds of prompts — when to use each? The step-by-step prompts (the earlier sections) plan with you stage by stage: you learn and control every detail. The all-in-one prompts (this section) hand you a complete piece of work in one go — review it carefully before submitting. The secret of an all-in-one prompt: curriculum + grade + colors + games. Note: some tools return text only and you do the layout — if it comes back as text, ask: “give it to me as a printable file”." },
  prompts:[
  { t:{ar:"الجريدة الصفية الكاملة",en:"The Complete Class Newspaper"},
    ar:"صّمم لي نشاطًا في شكل جريدة حقيقية ملّونة لتلخيص درس [اسم الدرس] للصف [ ] من منهج [اذكر المنهج]. اجعلها من [عدد] صفحات تحتوي على: عنوان رئيسي وشعار، ومقال يلّخص الدرس، وصندوق “هل تعلم؟”، وركن ألعاب فيه كلمات متقاطعة ومتاهة وأي لعبة أخرى مناسبة للدرس، وصفحة أخيرة ترفيهية. ضع حلول الألعاب في نهاية الجريدة، واستخدم ألوانًا واضحة وتنسيقًا يشبه الجرائد الحقيقية.",
    en:"Design an activity in the form of a real colorful newspaper summarizing the lesson [lesson name] for grade [ ], curriculum [name the curriculum]. Make it [number] pages containing: a masthead and slogan, an article summarizing the lesson, a “Did you know?” box, a games corner with a crossword, a maze, and any other game suited to the lesson, plus a fun back page. Put the game solutions separately at the end. Use clear colors and a layout that looks like a real newspaper." },
  { t:{ar:"المجلة التعليمية الكاملة",en:"The Complete Educational Magazine"},
    ar:"صّمم لي مجلة تعليمية ملّونة من [عدد] صفحات عن درس [اسم الدرس] للصف [ ] من منهج [ ]. اجعلها تحتوي على: غلاف بعنوان جذاب، وفهرس، ومقال رئيسي مصّور، وإنفوجرافيك للمعلومات الرقمية، وقصة مصّورة قصيرة، وتجربة منزلية آمنة، وصفحة تحديات بثلاثة مستويات. استخدم نظام ألوان موّحدًا في كل الصفحات.",
    en:"Design a colorful [number]-page educational magazine about the lesson [lesson name] for grade [ ], curriculum [ ]. Include: a cover with a catchy title, a contents page, an illustrated feature article, an infographic for the numerical facts, a short comic strip, a safe home experiment, and a challenges page with three levels. Use one consistent color scheme throughout." },
  { t:{ar:"اللوحة التعليمية الكاملة",en:"The Complete Poster"},
    ar:"صّمم لي لوحة تعليمية ملّونة عن درس [اسم الدرس] للصف [ ] من منهج [ ]، بمقاس [ ]. اجعلها تحتوي على: عنوان كبير، و٤ أقسام مرّتبة بصريًا، ورسومًا توضيحية بسيطة يمكنني رسمها بيدي، وصندوق معلومات مدهشة، وخطًا زمنيًا إن كان الدرس يناسبه. اجعل النص قليلًا وواضحًا من مسافة بعيدة.",
    en:"Design a colorful educational poster about the lesson [lesson name] for grade [ ], curriculum [ ], size [ ]. Include: a large title, 4 visually organized sections, simple illustrations I can draw by hand, a surprising-facts box, and a timeline if the lesson suits one. Keep the text minimal and readable from a distance." },
  { t:{ar:"كتّيب المراجعة الكامل",en:"The Complete Revision Booklet"},
    ar:"صّمم لي كتّيب مراجعة ملّونًا من [عدد] صفحات لدرس [اسم الدرس] للصف [ ] من منهج [ ]. اجعله يحتوي على: ملّخصًا في خريطة ذهنية، وجدول المصطلحات، و١٥ بطاقة مراجعة، واختبارًا قصيرًا، وقائمة الأخطاء الشائعة، وصفحة “ماذا أراجع قبل الامتحان”. ضع الإجابات في نهاية الكتّيب.",
    en:"Design a colorful [number]-page revision booklet for the lesson [lesson name], grade [ ], curriculum [ ]. Include: a mind-map summary, a glossary table, 15 flashcards, a short quiz, a list of common mistakes, and a “What to review the day before the exam” page. Put all answers at the end." },
  { t:{ar:"لعبة لوحية تعليمية",en:"Educational Board Game"},
    ar:"صّمم لي لعبة لوحية ملّونة قابلة للطباعة عن درس [اسم الدرس] للصف [ ] من منهج [ ]، ُتلعب بين [عدد] لاعبين. أعطني: تصميم مسار اللعبة بالخانات، وقواعد اللعب واضحة، و٢٠ بطاقة أسئلة من الدرس بثلاثة مستويات صعوبة، وخانات مفاجآت (تقّدم/تراجع). واجعلها ممتعة لا امتحانية.",
    en:"Design a colorful printable board game about the lesson [lesson name], grade [ ], curriculum [ ], for [number] players. Give me: the board path with squares, clear rules, 20 question cards from the lesson at three difficulty levels, and surprise squares (move forward/back). Make it fun rather than exam-like." },
  { t:{ar:"ملف الأنشطة والألعاب",en:"Activity & Games Pack"},
    ar:"صّمم لي ملف أنشطة ملّونًا عن درس [اسم الدرس] للصف [ ] من منهج [ ] يحتوي على ٦ ألعاب مختلفة: كلمات متقاطعة، ومتاهة، وابحث عن الكلمة، وِصل بين العمودين، ورّتب الخطوات، وألغاز “من أنا؟”. اجعل كل لعبة في صفحة مستقلة بتعليمات واضحة، وضع كل الحلول في الصفحة الأخيرة.",
    en:"Design a colorful activity pack about the lesson [lesson name], grade [ ], curriculum [ ], containing 6 different games: a crossword, a maze, a word search, a matching exercise, a sequencing task, and “Who am I?” riddles. Put each game on its own page with clear instructions, and all solutions on the last page." },
  { t:{ar:"القصة المصّورة التعليمية",en:"Educational Comic"},
    ar:"صّمم لي قصة مصّورة ملّونة من [عدد] لقطات تشرح درس [اسم الدرس] للصف [ ] من منهج [ ]. اجعل البطل طالبًا في مثل سّني يواجه مشكلة ُتحّل بمعلومات الدرس. اكتب لكل لقطة: وصف المشهد، والحوار في جملتين، ثم اختم بصفحة “ما تعّلمناه” و٣ أسئلة للقارئ.",
    en:"Design a colorful [number]-panel comic that teaches the lesson [lesson name], grade [ ], curriculum [ ]. Make the hero a student my age facing a problem solved by the lesson’s content. For each panel write: a scene description and two lines of dialogue, then end with a “What we learned” page and 3 questions for the reader." },
  { t:{ar:"العرض التقديمي الكامل",en:"The Complete Presentation"},
    ar:"صّمم لي عرضًا تقديميًا ملّونًا من [عدد] شرائح عن [اسم الدرس] للصف [ ] من منهج [ ]، مدته [عدد] دقائق. اكتب لكل شريحة: العنوان، و٣ نقاط قصيرة، وفكرة صورة، وما أقوله شفهيًا في ٣ ُجمل. اجعل الشريحة الأولى جاذبة والأخيرة تحتوي على سؤال للجمهور. أضف في النهاية ٥ أسئلة متوّقعة بإجاباتها.",
    en:"Design a colorful [number]-slide presentation about the lesson [lesson name], grade [ ], curriculum [ ], lasting [number] minutes. For each slide write: the title, 3 short points, an image idea, and what I say out loud in 3 sentences. Make the first slide attention-grabbing and the last one end with a question for the audience. Add 5 likely questions with answers at the end." },
  { t:{ar:"البطاقات التعليمية القابلة للطباعة",en:"Printable Flashcard Set"},
    ar:"صّمم لي مجموعة من [عدد] بطاقة تعليمية ملّونة قابلة للقص عن درس [اسم الدرس] للصف [ ] من منهج [ ]. اجعل كل بطاقة بوجهين: الأمامي سؤال أو مصطلح مع رمز بصري، والخلفي إجابة لا تتجاوز ١٥ كلمة. لّون البطاقات حسب الموضوع الفرعي، وأضف تعليمات ٣ طرق مختلفة لاستخدامها في المذاكرة.",
    en:"Design a set of [number] colorful cut-out flashcards for the lesson [lesson name], grade [ ], curriculum [ ]. Each card two-sided: front = a question or term with a visual symbol, back = an answer under 15 words. Color-code the cards by subtopic, and add instructions for 3 different ways to study with them." },
  { t:{ar:"المشروع المتكامل",en:"The Complete School Project"},
    ar:"صّمم لي مشروعًا مدرسيًا متكاملًا عن درس [اسم الدرس] للصف [ ] من منهج [ ]، مدته [عدد] أيام. أعطني: فكرة المشروع، وخطة زمنية بالمراحل، وقائمة المواد المطلوبة، وخطوات التنفيذ، وشكل المخرج النهائي، ونّص العرض أمام الصف، وجدول تقييم من ٥ معايير أقّيم به نفسي.",
    en:"Design a complete school project about the lesson [lesson name], grade [ ], curriculum [ ], over [number] days. Give me: the project idea, a staged timeline, a materials list, execution steps, the final deliverable’s format, a script for presenting it to the class, and a 5-criteria rubric for self-assessment." }
]}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function flat(){var o=[];PROMPT_DATA.forEach(function(s,si){s.prompts.forEach(function(p,i){o.push({s:s,si:si,i:i,p:p,key:s.id+":"+i})})});return o}
function tint(c){return c+"24"}

function toast(){var t=document.getElementById("toast");t.style.display="flex";clearTimeout(window._tt);window._tt=setTimeout(function(){t.style.display="none"},1600)}
function copyText(t,key){
  function done(){ST.copied=key;toast();render();setTimeout(function(){ST.copied=null;render()},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fb(t,done)})}else fb(t,done);
}
function fb(t,done){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);done()}

window.APP={

 part:function(k){if(ST.parts[k])delete ST.parts[k];else ST.parts[k]=1;render()},
